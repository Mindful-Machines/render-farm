name: images

# Builds Dockerfile's three targets and pushes them to ghcr.io:
#   render-farm-manager:<FLAMENCO_VERSION>, render-farm-worker:<BLENDER_VERSION>, render-farm-sync:<RCLONE_VERSION>, plus :sha-<commit> for each.
on:
  push:
    branches: [master]
    paths: [Dockerfile, src/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manager
            version_arg: FLAMENCO_VERSION
          - target: worker
            version_arg: BLENDER_VERSION
          - target: sync
            version_arg: RCLONE_VERSION
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(grep -oP '^ARG ${{ matrix.version_arg }}=\K.*' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mindful-machines/render-farm-${{ matrix.target }}:${{ steps.version.outputs.version }}
            ghcr.io/mindful-machines/render-farm-${{ matrix.target }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
